name: Publish Docker image

on:
  push:
    tags:
      - 'release-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '需要重新构建的现有发布标签，例如 release-v0.1.47'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout release
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}

      - name: Validate release
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          [[ "$RELEASE_TAG" == "release-v$version" ]]
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Audit release dependencies
        run: npm audit --audit-level=high

  build:
    needs: prepare
    # 各架构使用原生 runner，避免 QEMU 执行原生依赖时崩溃或挂起。
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/oldj/publa
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          # 先按 digest 上传，所有架构验证成功后才更新版本和 latest 标签。
          outputs: type=image,name=ghcr.io/oldj/publa,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=publa-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=publa-${{ matrix.arch }}
          provenance: false

      - name: Smoke test image
        env:
          IMAGE: ghcr.io/oldj/publa@${{ steps.build.outputs.digest }}
        run: |
          docker run -d --name publa-smoke -p 127.0.0.1:8084:8084 "$IMAGE"
          curl --fail --silent --show-error --retry 30 --retry-delay 2 \
            --retry-connrefused --retry-all-errors --max-time 5 \
            http://127.0.0.1:8084/setup -o /tmp/publa-setup.html
          # 验证验证码生成与 SQLite 写入，覆盖原生模块和迁移文件的打包结果。
          curl --fail --silent --show-error --max-time 10 \
            http://127.0.0.1:8084/api/captcha -o /tmp/publa-captcha.svg
          grep -q '<svg' /tmp/publa-captcha.svg

      - name: Show logs and clean up
        if: always()
        run: |
          if docker container inspect publa-smoke >/dev/null 2>&1; then
            docker logs publa-smoke
            docker rm -fv publa-smoke
          fi

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-platform image
        working-directory: /tmp/digests
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          image=ghcr.io/oldj/publa
          tags=(--tag "$image:$VERSION")
          if [[ "$VERSION" != *-* ]]; then
            tags+=(--tag "$image:latest")
          fi
          digests=()
          for digest in *; do
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
            digests+=("$image@sha256:$digest")
          done
          [[ "${#digests[@]}" -eq 2 ]]
          docker buildx imagetools create "${tags[@]}" "${digests[@]}"
          docker buildx imagetools inspect "$image:$VERSION" --raw | \
            jq -e '[.manifests[].platform | .os + "/" + .architecture] | sort == ["linux/amd64", "linux/arm64"]'
